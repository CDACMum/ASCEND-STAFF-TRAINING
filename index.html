<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCEND · C-DAC Mumbai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#000000;
    --ink:#080603;
    --panel:#0d0a05;
    --gold:#e8c37a;
    --gold-bright:#fbe6b6;
    --gold-hi:#fff6dc;
    --gold-deep:#a9791f;
    --cream:#f3ead8;
    --sand:#a08d6a;
    --edge:rgba(232,195,122,.30);
    --edge-soft:rgba(232,195,122,.16);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{font-family:"Space Grotesk",system-ui,sans-serif;background:#000;color:var(--cream);overflow:hidden;-webkit-font-smoothing:antialiased;}
  .frame{position:fixed;inset:0;overflow:hidden;background:#000;}

  /* ---------- STAGE ---------- */
  .stage{position:absolute;inset:0;background:
    radial-gradient(120% 90% at 50% -10%, rgba(232,195,122,.12), transparent 46%),
    radial-gradient(90% 60% at 50% 118%, rgba(169,121,31,.10), transparent 55%),
    radial-gradient(150% 140% at 50% 46%, #0d0a05 0%, #070502 44%, #000 100%);
    display:flex;align-items:center;justify-content:center;padding:clamp(30px,5vw,74px);}

  .aurora{position:absolute;inset:-20%;z-index:0;filter:blur(90px);opacity:.4;pointer-events:none;}
  .aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen;}
  .aurora .a1{width:44vmax;height:44vmax;left:-4%;top:-16%;background:radial-gradient(circle,rgba(232,195,122,.5),transparent 68%);animation:drift1 26s ease-in-out infinite;}
  .aurora .a2{width:36vmax;height:36vmax;right:-6%;top:6%;background:radial-gradient(circle,rgba(251,230,182,.34),transparent 68%);animation:drift2 30s ease-in-out infinite;}
  .aurora .a3{width:50vmax;height:50vmax;left:26%;bottom:-28%;background:radial-gradient(circle,rgba(169,121,31,.4),transparent 66%);animation:drift3 34s ease-in-out infinite;}
  @keyframes drift1{50%{transform:translate(7%,6%) scale(1.1);}}
  @keyframes drift2{50%{transform:translate(-6%,8%) scale(1.08);}}
  @keyframes drift3{50%{transform:translate(5%,-6%) scale(1.12);}}

  #space{position:absolute;inset:0;z-index:1;pointer-events:none;}

  .rays{position:absolute;left:50%;top:46%;width:170vmax;height:170vmax;z-index:1;
    transform:translate(-50%,-50%) rotate(0deg);transform-origin:50% 50%;
    background:repeating-conic-gradient(from 0deg, rgba(251,230,182,.10) 0deg 2.2deg, transparent 2.2deg 13deg);
    -webkit-mask:radial-gradient(circle at 50% 50%, transparent 6%, #000 22%, #000 44%, transparent 72%);
    mask:radial-gradient(circle at 50% 50%, transparent 6%, #000 22%, #000 44%, transparent 72%);
    opacity:0;filter:blur(2px);pointer-events:none;transition:opacity 1.6s ease .7s;}
  .is-open .rays{opacity:.9;animation:spin 110s linear infinite;}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg);}}

  /* warm golden bloom behind the wordmark */
  .bloom{position:absolute;left:50%;top:46%;width:46vmax;height:46vmax;z-index:2;transform:translate(-50%,-50%) scale(.15);
    background:radial-gradient(circle,rgba(255,246,220,.85),rgba(232,195,122,.45) 32%,transparent 64%);
    opacity:0;pointer-events:none;filter:blur(6px);}
  .is-open .bloom{animation:bloom 1.5s ease-out .5s 1;}
  @keyframes bloom{0%{transform:translate(-50%,-50%) scale(.15);opacity:0;}22%{opacity:.9;}100%{transform:translate(-50%,-50%) scale(2.7);opacity:0;}}

  /* twin shockwave rings from centre */
  .shock,.shock2{position:absolute;left:50%;top:46%;width:16px;height:16px;border-radius:50%;z-index:2;
    border:2px solid rgba(251,230,182,.7);transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none;box-shadow:0 0 26px rgba(232,195,122,.5);}
  .is-open .shock{animation:shock 1.2s cubic-bezier(.2,.7,.2,1) .5s 1;}
  .is-open .shock2{animation:shock 1.4s cubic-bezier(.2,.7,.2,1) .74s 1;border-color:rgba(232,195,122,.45);}
  @keyframes shock{0%{transform:translate(-50%,-50%) scale(0);opacity:.9;}70%{opacity:.45;}100%{transform:translate(-50%,-50%) scale(95);opacity:0;}}

  .frmline{position:absolute;inset:clamp(18px,2.4vw,32px);z-index:3;border:1px solid var(--edge-soft);pointer-events:none;
    box-shadow:inset 0 0 0 4px rgba(0,0,0,.5), inset 0 0 0 5px rgba(232,195,122,.12);
    opacity:0;transition:opacity 1.2s ease .8s;}
  .is-open .frmline{opacity:1;}
  .corner{position:absolute;width:7px;height:7px;transform:rotate(45deg);background:linear-gradient(135deg,var(--gold-hi),var(--gold-deep));z-index:4;pointer-events:none;box-shadow:0 0 8px rgba(232,195,122,.5);opacity:0;transition:opacity 1.2s ease .9s;}
  .is-open .corner{opacity:1;}
  .corner.tl{top:calc(clamp(18px,2.4vw,32px) - 3px);left:calc(clamp(18px,2.4vw,32px) - 3px);}
  .corner.tr{top:calc(clamp(18px,2.4vw,32px) - 3px);right:calc(clamp(18px,2.4vw,32px) - 3px);}
  .corner.bl{bottom:calc(clamp(18px,2.4vw,32px) - 3px);left:calc(clamp(18px,2.4vw,32px) - 3px);}
  .corner.br{bottom:calc(clamp(18px,2.4vw,32px) - 3px);right:calc(clamp(18px,2.4vw,32px) - 3px);}

  .content{position:relative;z-index:5;width:min(820px,100%);text-align:center;
    opacity:0;transform:translateY(26px);transition:opacity 1.1s ease .55s,transform 1.2s cubic-bezier(.2,.8,.2,1) .55s;}
  .is-open .content{opacity:1;transform:none;}

  .logo-corner{position:absolute;top:clamp(28px,3.6vw,48px);right:clamp(30px,4vw,54px);width:clamp(66px,8vw,112px);height:auto;z-index:6;opacity:0;transition:opacity 1s ease .8s;filter:drop-shadow(0 0 20px rgba(232,195,122,.45));}
  .is-open .logo-corner{opacity:1;}
  .kicker{font-family:"Space Grotesk",sans-serif;font-weight:600;letter-spacing:.4em;font-size:clamp(11px,1.5vw,15px);color:var(--cream);text-transform:uppercase;}
  .subkicker{font-family:"Space Grotesk",sans-serif;font-weight:500;letter-spacing:.28em;font-size:clamp(9px,1.2vw,12px);color:var(--gold);text-transform:uppercase;margin-top:9px;}

  .wordmark{display:flex;align-items:center;justify-content:center;gap:clamp(6px,1.2vw,16px);line-height:.86;margin-top:clamp(16px,2.6vw,26px);}
  .ascend-wrap{position:relative;display:inline-block;overflow:hidden;}
  .ascend{display:block;font-family:"Archivo",sans-serif;font-weight:900;font-size:clamp(58px,13vw,160px);letter-spacing:-.01em;
    background:linear-gradient(100deg,#a9791f 0%,#f4d58d 18%,#fff6dc 34%,#e8c37a 52%,#fff6dc 70%,#c99a3e 88%,#f4d58d 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;background-size:230% 100%;background-position:100% 0;
    filter:drop-shadow(0 3px 30px rgba(232,195,122,.28));}
  .is-open .ascend{animation:ignite 2s cubic-bezier(.2,.7,.2,1) .55s both;}
  @keyframes ignite{
    0%{background-position:100% 0;transform:scale(.9);filter:drop-shadow(0 0 0 rgba(232,195,122,0)) brightness(.5);}
    55%{transform:scale(1.02);filter:drop-shadow(0 0 48px rgba(251,230,182,.72)) brightness(1.22);}
    100%{background-position:0 0;transform:scale(1);filter:drop-shadow(0 3px 30px rgba(232,195,122,.32)) brightness(1);}}
  /* ongoing luxury glint sweeping across the letters */
  .glint{position:absolute;top:0;left:0;height:100%;width:52%;pointer-events:none;
    background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.6) 50%,transparent 60%);
    transform:translateX(-170%) skewX(-12deg);mix-blend-mode:screen;opacity:0;}
  .is-open .glint{animation:glint 6.5s ease-in-out 2.9s infinite;}
  @keyframes glint{0%{transform:translateX(-170%) skewX(-12deg);opacity:0;}
    3%{opacity:1;}13%{transform:translateX(250%) skewX(-12deg);opacity:1;}15%{opacity:0;}
    100%{transform:translateX(250%) skewX(-12deg);opacity:0;}}
  .arrow{width:clamp(24px,3.6vw,50px);height:clamp(40px,7vw,92px);align-self:flex-start;margin-top:-4px;filter:drop-shadow(0 0 16px rgba(232,195,122,.5));}

  .creed{font-family:"Space Grotesk",sans-serif;font-weight:500;letter-spacing:.46em;font-size:clamp(10px,1.4vw,14px);color:var(--gold);text-transform:uppercase;margin-top:clamp(12px,2vw,18px);}

  .divider{display:flex;align-items:center;justify-content:center;gap:12px;margin:clamp(20px,3vw,32px) auto;}
  .divider span{height:1px;width:min(160px,26vw);background:linear-gradient(90deg,transparent,var(--gold-deep),var(--gold));}
  .divider span.r{background:linear-gradient(90deg,var(--gold),var(--gold-deep),transparent);}
  .divider b{width:7px;height:7px;transform:rotate(45deg);flex:none;background:linear-gradient(135deg,var(--gold-hi),var(--gold-deep));box-shadow:0 0 14px rgba(232,195,122,.6);}

  .journey{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:clamp(26px,4.4vw,50px);color:var(--cream);line-height:1.06;}
  .journey em{font-style:italic;color:var(--gold-bright);text-shadow:0 0 28px rgba(232,195,122,.45);}
  .journey small{display:block;font-family:"Space Grotesk",sans-serif;font-weight:500;letter-spacing:.22em;font-size:clamp(10px,1.4vw,13px);color:var(--sand);margin-top:12px;text-transform:uppercase;}

  .chips{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:clamp(26px,3.6vw,36px);}
  .chip{display:inline-flex;align-items:center;gap:12px;padding:13px 26px;border-radius:2px;
    background:linear-gradient(160deg,rgba(30,22,8,.6),rgba(10,8,3,.55));border:1px solid var(--edge);
    box-shadow:0 12px 32px rgba(0,0,0,.5),inset 0 1px 0 rgba(232,195,122,.12);}
  .chip .ic{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--ink);
    background:linear-gradient(140deg,var(--gold-hi),var(--gold) 55%,var(--gold-deep));box-shadow:0 3px 12px rgba(232,195,122,.3);}
  .chip .ic svg{width:17px;height:17px;}
  .chip .lab{font-family:"Space Grotesk",sans-serif;font-size:9.5px;letter-spacing:.2em;font-weight:600;color:var(--gold);text-transform:uppercase;}
  .chip .val{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:16px;color:var(--cream);margin-top:2px;}
  .chip .txt{text-align:left;}

  .footer-line{margin-top:clamp(26px,3.4vw,36px);font-family:"Space Grotesk",sans-serif;font-size:clamp(10px,1.4vw,13px);font-weight:500;letter-spacing:.26em;color:var(--sand);text-transform:uppercase;}
  .footer-line b{color:var(--cream);font-weight:600;}
  .footer-line i{color:var(--gold);font-style:normal;margin:0 10px;}

  /* ---------- GATE ---------- */
  .gate-wrap{position:absolute;inset:0;z-index:20;}
  .panel{position:absolute;top:0;bottom:0;width:50.6%;overflow:hidden;background:linear-gradient(180deg,#0d0a05,#000);transition:transform 1.6s cubic-bezier(.66,0,.2,1);will-change:transform;}
  .panel::after{content:"";position:absolute;inset:0;opacity:.5;
    background:repeating-linear-gradient(90deg,transparent 0 40px,rgba(232,195,122,.04) 40px 41px),
              repeating-linear-gradient(0deg,transparent 0 40px,rgba(232,195,122,.03) 40px 41px);}
  .panel.left{left:0;box-shadow:inset -24px 0 70px rgba(0,0,0,.55);}
  .panel.right{right:0;box-shadow:inset 24px 0 70px rgba(0,0,0,.55);}
  .is-open .panel.left{transform:translateX(-101%);}
  .is-open .panel.right{transform:translateX(101%);}

  .gate-ui{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .5s ease;padding:20px;text-align:center;}
  .is-open .gate-ui{opacity:0;pointer-events:none;}
  .gate-logo{width:clamp(78px,10vw,126px);height:auto;filter:drop-shadow(0 0 34px rgba(232,195,122,.5));animation:logofloat 5s ease-in-out infinite;}
  @keyframes logofloat{50%{transform:translateY(-6px);}}
  .gate-name{font-family:"Space Grotesk",sans-serif;font-weight:600;letter-spacing:.4em;font-size:clamp(14px,2.2vw,22px);color:var(--cream);text-transform:uppercase;}
  .gate-presents{display:flex;align-items:center;gap:14px;color:var(--gold);font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(16px,2.2vw,24px);}
  .gate-presents span{height:1px;width:52px;background:linear-gradient(90deg,transparent,var(--gold));}
  .gate-presents span.r{background:linear-gradient(90deg,var(--gold),transparent);}

  .btn{margin-top:10px;position:relative;cursor:pointer;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:clamp(13px,1.7vw,16px);letter-spacing:.22em;color:var(--gold-bright);text-transform:uppercase;padding:17px 46px;border-radius:2px;
    background:rgba(20,15,6,.55);border:1px solid var(--gold);
    box-shadow:0 0 0 1px rgba(0,0,0,.5),0 14px 40px rgba(0,0,0,.6),inset 0 0 22px rgba(232,195,122,.08);
    display:inline-flex;align-items:center;gap:14px;overflow:hidden;transition:transform .3s ease,box-shadow .3s ease,color .3s ease,background .3s ease;animation:btnpulse 3s ease-in-out infinite;}
  .btn:hover{transform:translateY(-2px);color:var(--ink);background:linear-gradient(100deg,var(--gold-hi),var(--gold) 55%,var(--gold-deep));box-shadow:0 22px 56px rgba(232,195,122,.4),inset 0 0 0 1px rgba(255,255,255,.3);}
  .btn:hover svg{stroke:var(--ink);}
  .btn:focus-visible{outline:2px solid var(--gold-hi);outline-offset:5px;}
  .btn svg{width:18px;height:18px;stroke:var(--gold-bright);transition:stroke .3s ease;}
  @keyframes btnpulse{50%{box-shadow:0 14px 40px rgba(0,0,0,.6),inset 0 0 30px rgba(232,195,122,.18),0 0 26px 1px rgba(232,195,122,.3);}}
  .gate-hint{font-family:"Space Grotesk",sans-serif;letter-spacing:.24em;font-size:clamp(9px,1.2vw,11px);color:var(--sand);opacity:.8;text-transform:uppercase;}

  .scan{position:absolute;left:0;right:0;height:2px;z-index:23;top:0;opacity:0;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(251,230,182,.9),transparent);box-shadow:0 0 24px 4px rgba(232,195,122,.5);}
  .is-open .scan{animation:scan 1.2s ease-in-out .35s 1;}
  @keyframes scan{0%{top:0;opacity:0;}12%{opacity:1;}88%{opacity:1;}100%{top:100%;opacity:0;}}

  #burst{position:absolute;inset:0;z-index:36;pointer-events:none;}

  .sound{position:absolute;left:18px;bottom:18px;z-index:40;width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--edge);background:rgba(10,8,3,.6);color:var(--gold);border-radius:50%;cursor:pointer;opacity:.7;transition:opacity .2s,background .2s,color .2s,transform .2s;}
  .sound:hover{opacity:1;transform:translateY(-1px);background:var(--gold);color:var(--ink);}
  .sound:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px;}
  .sound svg{width:19px;height:19px;stroke:currentColor;}

  .controls{position:absolute;right:18px;bottom:18px;z-index:40;display:flex;gap:10px;opacity:0;transition:opacity .5s ease 1s;}
  .is-open .controls{opacity:1;}
  .ctrl{border:1px solid var(--edge);background:rgba(10,8,3,.65);color:var(--gold);font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;border-radius:2px;padding:9px 15px;cursor:pointer;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px;transition:transform .2s,background .2s,color .2s;}
  .ctrl:hover{transform:translateY(-1px);background:var(--gold);color:var(--ink);}
  .ctrl:hover svg{stroke:var(--ink);}
  .ctrl:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px;}
  .ctrl svg{width:15px;height:15px;stroke:var(--gold);transition:stroke .2s;}

  @media (max-width:560px){.chip{padding:11px 18px;} .panel{width:51.5%;}}
  @media (prefers-reduced-motion:reduce){
    .aurora i,.seam,.btn,.gate-logo,.is-open .rays,.is-open .glint{animation:none;}
    .rays,.frmline,.corner{transition:opacity .6s ease;}
    .panel{transition:opacity .6s ease;}
    .is-open .panel.left,.is-open .panel.right{transform:none;opacity:0;}
    .content{transition:opacity .6s ease;transform:none;}
    .is-open .ascend{animation:none;background-position:0 0;transform:none;filter:drop-shadow(0 3px 26px rgba(232,195,122,.3));}
    .is-open .scan,.is-open .shock,.is-open .shock2,.is-open .bloom{animation:none;}
  }
</style>
</head>

<script>
(function(){
  var frame=document.getElementById('frame'),btn=document.getElementById('revealBtn'),
      reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches,opened=false;
  function open(){ if(opened)return; opened=true; frame.classList.add('is-open'); playMusic(); if(!reduce) setTimeout(fireBurst,760); }
  function reset(){ frame.classList.remove('is-open'); opened=false; }
  function toggleFs(){ if(!document.fullscreenElement){ (frame.requestFullscreen?frame.requestFullscreen():frame.webkitRequestFullscreen&&frame.webkitRequestFullscreen()); } else{ document.exitFullscreen&&document.exitFullscreen(); } }
  btn.addEventListener('click',open);
  document.addEventListener('keydown',function(e){
    if(!opened && (e.key==='Enter'||e.key===' ') && (document.activeElement===btn||document.activeElement===document.body)){ e.preventDefault(); open(); return; }
    if(e.key==='r'||e.key==='R'){ if(opened){ reset(); setTimeout(open,740); } }
    if(e.key==='f'||e.key==='F'){ toggleFs(); }
    if(e.key==='m'||e.key==='M'){ toggleMute(); }
  });

  /* ---------- Sound (Web Audio, synthesized — no external files) ---------- */
  var AC=null, master=null, muted=false;
  var soundBtn=document.getElementById('soundBtn');
  var icOn='<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.4 8.6a5 5 0 0 1 0 6.8"/><path d="M19 6a8 8 0 0 1 0 12"/></svg>';
  var icOff='<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></svg>';
  if(soundBtn){ soundBtn.innerHTML=icOn; soundBtn.addEventListener('click',function(e){ e.stopPropagation(); toggleMute(); }); }
  function toggleMute(){ muted=!muted; if(master&&AC) master.gain.setTargetAtTime(muted?0:0.85,AC.currentTime,0.02); if(soundBtn) soundBtn.innerHTML=muted?icOff:icOn; }
  function initAudio(){ if(AC) return;
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=muted?0:0.85;
    var comp=AC.createDynamicsCompressor(); comp.threshold.value=-13; comp.knee.value=22; comp.ratio.value=3.2; comp.attack.value=0.003; comp.release.value=0.25;
    var rev=AC.createConvolver(); rev.buffer=makeIR(2.4,2.6);
    var revG=AC.createGain(); revG.gain.value=0.36;
    master.connect(comp); rev.connect(revG); revG.connect(comp); comp.connect(AC.destination); master._rev=rev; }
  function makeIR(dur,dec){ var n=Math.floor(AC.sampleRate*dur), b=AC.createBuffer(2,n,AC.sampleRate);
    for(var c=0;c<2;c++){ var d=b.getChannelData(c); for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,dec); } return b; }
  function tone(fr,t0,dur,type,vol,toRev){ var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;
    o.type=type||'sine'; o.frequency.value=fr;
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.012); g.gain.exponentialRampToValueAtTime(0.0006,t+dur);
    o.connect(g); g.connect(master); if(toRev) g.connect(master._rev); o.start(t); o.stop(t+dur+0.05); }
  function riser(t0,dur){ var src=AC.createBufferSource(), b=AC.createBuffer(1,Math.floor(AC.sampleRate*dur),AC.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<d.length;i++) d[i]=Math.random()*2-1; src.buffer=b;
    var f=AC.createBiquadFilter(); f.type='bandpass'; f.Q.value=0.9; var t=AC.currentTime+t0;
    f.frequency.setValueAtTime(240,t); f.frequency.exponentialRampToValueAtTime(3400,t+dur);
    var g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.08,t+dur*0.88); g.gain.exponentialRampToValueAtTime(0.001,t+dur+0.12);
    src.connect(f); f.connect(g); g.connect(master); g.connect(master._rev); src.start(t); src.stop(t+dur+0.2); }
  function boom(t0){ var t=AC.currentTime+t0;
    var o=AC.createOscillator(),g=AC.createGain(); o.type='sine';
    o.frequency.setValueAtTime(88,t); o.frequency.exponentialRampToValueAtTime(38,t+0.5);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.5,t+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+1.15);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+1.25);
    var src=AC.createBufferSource(), b=AC.createBuffer(1,Math.floor(AC.sampleRate*0.32),AC.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3); src.buffer=b;
    var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=650;
    var ng=AC.createGain(); ng.gain.setValueAtTime(0.32,t); ng.gain.exponentialRampToValueAtTime(0.001,t+0.3);
    src.connect(lp); lp.connect(ng); ng.connect(master); src.start(t); src.stop(t+0.34); }
  function pluck(fr,t0,dur,vol){ var t=AC.currentTime+t0;
    function mk(f,ty,v,d){ var o=AC.createOscillator(),g=AC.createGain(); o.type=ty; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(v,t+0.006); g.gain.exponentialRampToValueAtTime(0.0004,t+d);
      o.connect(g); g.connect(master); g.connect(master._rev); o.start(t); o.stop(t+d+0.05); }
    mk(fr,'triangle',vol,dur); mk(fr*2,'sine',vol*0.34,dur*0.7); mk(fr*3,'sine',vol*0.12,dur*0.5); }
  function pad(frs,t0,dur,vol){ var t=AC.currentTime+t0, g=AC.createGain(), lp=AC.createBiquadFilter();
    lp.type='lowpass';
    lp.frequency.setValueAtTime(300,t); lp.frequency.linearRampToValueAtTime(1700,t+dur*0.45); lp.frequency.linearRampToValueAtTime(640,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.9); g.gain.setValueAtTime(vol,t+dur-1.5); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    g.connect(lp); lp.connect(master); lp.connect(master._rev);
    frs.forEach(function(fr){ [-0.007,0.007].forEach(function(det){
      var o=AC.createOscillator(),og=AC.createGain(); o.type='sawtooth'; o.frequency.value=fr*(1+det); og.gain.value=0.3;
      o.connect(og); og.connect(g); o.start(t); o.stop(t+dur+0.1); }); }); }
  function kick(t0,vol){ var t=AC.currentTime+t0, o=AC.createOscillator(), g=AC.createGain();
    o.type='sine'; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(46,t+0.11);
    g.gain.setValueAtTime((vol||0.8),t); g.gain.exponentialRampToValueAtTime(0.001,t+0.24);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+0.26); }
  function hat(t0,vol){ var t=AC.currentTime+t0, src=AC.createBufferSource(), n=Math.floor(AC.sampleRate*0.05), b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<n;i++) d[i]=Math.random()*2-1; src.buffer=b;
    var hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7200;
    var g=AC.createGain(); g.gain.setValueAtTime((vol||0.15),t); g.gain.exponentialRampToValueAtTime(0.001,t+0.05);
    src.connect(hp); hp.connect(g); g.connect(master); src.start(t); src.stop(t+0.06); }
  function crash(t0,vol,dur){ var t=AC.currentTime+t0, D=dur||1.2, src=AC.createBufferSource(), n=Math.floor(AC.sampleRate*D), b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.4); src.buffer=b;
    var hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=3800;
    var g=AC.createGain(); g.gain.setValueAtTime((vol||0.25),t); g.gain.exponentialRampToValueAtTime(0.001,t+D);
    src.connect(hp); hp.connect(g); g.connect(master); g.connect(master._rev); src.start(t); src.stop(t+D+0.05); }
  function stab(frs,t0,dur,vol){ var t=AC.currentTime+t0, g=AC.createGain(), lp=AC.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.setValueAtTime(4300,t); lp.frequency.exponentialRampToValueAtTime(950,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.008); g.gain.exponentialRampToValueAtTime(0.0005,t+dur);
    g.connect(lp); lp.connect(master); lp.connect(master._rev);
    frs.forEach(function(fr){ [-0.006,0.006].forEach(function(det){ var o=AC.createOscillator(); o.type='sawtooth'; o.frequency.value=fr*(1+det); o.connect(g); o.start(t); o.stop(t+dur+0.05); }); }); }
  function bass(fr,t0,dur,vol){ var t=AC.currentTime+t0, o=AC.createOscillator(), o2=AC.createOscillator(), g=AC.createGain(), lp=AC.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.value=900; o.type='sawtooth'; o.frequency.value=fr; o2.type='square'; o2.frequency.value=fr;
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.01); g.gain.setValueAtTime(vol,t+dur*0.7); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(master); o.start(t); o2.start(t); o.stop(t+dur+0.05); o2.stop(t+dur+0.05); }
  function playMusic(){ try{ initAudio(); if(AC.state==='suspended') AC.resume();
      /* gentle swell as the gate opens */
      riser(0, 1.1);
      /* warm low foundation for gravitas */
      tone(65.41, 0.85, 2.4, 'sine', 0.12, false);                     // C2
      /* elegant string-like pad, moving I - IV - V slowly & with dignity */
      pad([130.81,261.63,329.63,392.00], 0.85, 3.8, 0.085);            // C major
      pad([174.61,349.23,440.00,523.25], 2.5, 3.4, 0.078);             // F major
      pad([196.00,392.00,493.88,587.33], 4.1, 3.2, 0.078);             // G major (gentle lift)
      /* soft airy shimmer at the reveal — dignified, not a crash */
      crash(0.9, 0.09, 2.4);
      /* graceful ascending harp/celesta motif — unhurried, elegant */
      var motif=[392.00,523.25,659.25,783.99,1046.50,1318.51];
      for(var i=0;i<motif.length;i++) pluck(motif[i], 1.05+i*0.30, 1.3, 0.072);
      /* two soft high sparkles to finish */
      pluck(1567.98, 3.3, 1.5, 0.048); pluck(2093.00, 3.75, 1.4, 0.038);
    }catch(e){} }

  /* ambient gold dust */
  var sc=document.getElementById('space'),sx=sc.getContext('2d'),dust=[],SW,SH;
  function ssize(){SW=sc.width=window.innerWidth;SH=sc.height=window.innerHeight;dust=[];var n=Math.min(120,Math.round(SW*SH/15000));
    for(var i=0;i<n;i++)dust.push({x:Math.random()*SW,y:Math.random()*SH,r:Math.random()*1.8+.4,a:Math.random(),tw:.004+Math.random()*.01,vy:.05+Math.random()*.2,vx:(Math.random()-.5)*.14});}
  window.addEventListener('resize',ssize);ssize();
  function sloop(){sx.clearRect(0,0,SW,SH);
    for(var i=0;i<dust.length;i++){var p=dust[i];p.a+=p.tw;var al=.22+.4*Math.sin(p.a);
      if(!reduce){p.y-=p.vy;p.x+=p.vx;if(p.y<0){p.y=SH;p.x=Math.random()*SW;}}
      sx.globalAlpha=Math.max(0,al);sx.fillStyle=i%5===0?'#fff6dc':'#e8c37a';sx.beginPath();sx.arc(p.x,p.y,p.r,0,6.28);sx.fill();}
    sx.globalAlpha=1;requestAnimationFrame(sloop);}
  if(reduce){sx.clearRect(0,0,SW,SH);for(var i=0;i<dust.length;i++){var p=dust[i];sx.globalAlpha=.4;sx.fillStyle='#e8c37a';sx.beginPath();sx.arc(p.x,p.y,p.r,0,6.28);sx.fill();}sx.globalAlpha=1;}
  else sloop();

  /* ---------- CENTRE celebration: sparks + ribbon-threads + foil ---------- */
  var bc=document.getElementById('burst'),bx=bc.getContext('2d'),parts=[],raf=null,BW,BH;
  var gold=['#fff6dc','#fbe6b6','#e8c37a','#c99a3e','#a9791f'];
  function bsize(){BW=bc.width=window.innerWidth;BH=bc.height=window.innerHeight;}
  window.addEventListener('resize',bsize);bsize();
  function rnd(a,b){return a+Math.random()*(b-a);}
  function fireBurst(){bsize();parts=[];
    var cx=BW/2, cy=BH*0.5;   // celebration originates from the exact middle
    // radial sparks — kept central (lower speed, shorter life)
    for(var i=0;i<110;i++){var ang=rnd(0,6.283),sp=rnd(3,10);
      parts.push({t:0,x:cx,y:cy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,g:.14,len:rnd(5,13),w:rnd(1,2.2),col:gold[(Math.random()*gold.length)|0],life:0,max:rnd(38,78)});}
    // ribbon threads (streamers) from centre
    for(var r=0;r<12;r++){var a2=rnd(-2.4,-0.75),sp2=rnd(4,8);
      parts.push({t:2,x:cx,y:cy,vx:Math.cos(a2)*sp2,vy:Math.sin(a2)*sp2,g:.16,trail:[],col:gold[(Math.random()*3)|0],w:rnd(2.5,4),life:0,max:rnd(90,150)});}
    // foil confetti burst from centre
    for(var f=0;f<72;f++){var a3=rnd(0,6.283),sp3=rnd(3,9);
      parts.push({t:1,x:cx,y:cy,vx:Math.cos(a3)*sp3,vy:Math.sin(a3)*sp3,g:.18,w:rnd(5,8),h:rnd(9,13),rot:rnd(0,6.283),vr:rnd(-.3,.3),sway:rnd(0,6.283),col:gold[(Math.random()*gold.length)|0],life:0,max:rnd(120,220)});}
    if(!raf)raf=requestAnimationFrame(bloop);}
  function bloop(){bx.clearRect(0,0,BW,BH);var alive=0;
    for(var i=0;i<parts.length;i++){var p=parts[i];p.life++;if(p.life>=p.max)continue;alive++;var al=Math.max(0,1-p.life/p.max);
      if(p.t===0){ p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;
        bx.globalAlpha=al*.95;bx.strokeStyle=p.col;bx.lineWidth=p.w;bx.lineCap='round';
        bx.beginPath();bx.moveTo(p.x,p.y);bx.lineTo(p.x-p.vx*.6,p.y-p.vy*.6);bx.stroke();
        bx.globalAlpha=al;bx.fillStyle=p.col;bx.beginPath();bx.arc(p.x,p.y,p.w*.7,0,6.28);bx.fill();
      } else if(p.t===2){ p.vy+=p.g;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;
        p.trail.push({x:p.x,y:p.y}); if(p.trail.length>18)p.trail.shift();
        for(var k=1;k<p.trail.length;k++){var seg=k/p.trail.length;
          bx.globalAlpha=al*seg;bx.strokeStyle=p.col;bx.lineWidth=p.w*seg;bx.lineCap='round';
          bx.beginPath();bx.moveTo(p.trail[k-1].x,p.trail[k-1].y);bx.lineTo(p.trail[k].x,p.trail[k].y);bx.stroke();}
      } else { p.vy+=p.g;p.vx*=.985;p.sway+=.12;p.x+=p.vx+Math.sin(p.sway)*.6;p.y+=p.vy;p.rot+=p.vr;
        bx.save();bx.translate(p.x,p.y);bx.rotate(p.rot);bx.globalAlpha=al;bx.fillStyle=p.col;
        bx.fillRect(-p.w/2,-p.h/2,p.w,p.h);bx.restore(); }
    }
    bx.globalAlpha=1;if(alive>0)raf=requestAnimationFrame(bloop);else{raf=null;bx.clearRect(0,0,BW,BH);}}
})();
</script>
